name: "MySQL DB Container"
description: "Run MySQL DB container"
inputs:
  mysql_version:
    description: "MySQL DB Server Version"
    type: string
    required: true
    default: "8.4"
  mysql_charset:
    description: "MySQL DB server character set"
    required: true
    default: "utf8mb4"
  mysql_collation:
    description: "MySQL DB server collation"
    required: true
    default: "utf8mb4_unicode_ci"
  mysql_db_instance:
    description: "MySQL DB instance name"
    required: true
    default: "doughnut_test"
  mysql_db_user:
    description: "MySQL DB username"
    required: true
  mysql_db_password:
    description: "MySQL DB password"
    required: true
  mysql_db_root_password:
    description: "Optional administrator password for isolated upgrade tests"
    required: false
    default: ""
  mysql_db_host_port:
    description: "MySQL DB host port"
    type: number
    required: true
    default: 3309
  mysql_db_container_port:
    description: "MySQL DB container port"
    type: number
    required: true
    default: 3309
runs:
  using: "composite"
  steps:
    - uses: yeongsheng-tan/mysql-action@v1.2.1
      with:
        mysql version: ${{ inputs.mysql_version }}
        character set server: ${{ inputs.mysql_charset }}
        collation server: ${{ inputs.mysql_collation }}
        mysql database: ${{ inputs.mysql_db_instance }}
        mysql user: ${{ inputs.mysql_db_user }}
        mysql password: ${{ inputs.mysql_db_password }}
        mysql root password: ${{ inputs.mysql_db_root_password }}
        host port: ${{ inputs.mysql_db_host_port }}
        container port: ${{ inputs.mysql_db_container_port }}
    - name: Create the named test account with administrator setup
      if: ${{ inputs.mysql_db_root_password != '' }}
      shell: bash
      env:
        MYSQL_BOOTSTRAP_ROOT_PASSWORD: ${{ inputs.mysql_db_root_password }}
        MYSQL_BOOTSTRAP_USER: ${{ inputs.mysql_db_user }}
        MYSQL_BOOTSTRAP_PASSWORD: ${{ inputs.mysql_db_password }}
        MYSQL_BOOTSTRAP_DATABASE: ${{ inputs.mysql_db_instance }}
        MYSQL_BOOTSTRAP_PORT: ${{ inputs.mysql_db_container_port }}
      run: bash "$GITHUB_ACTION_PATH/create-test-user.sh"
