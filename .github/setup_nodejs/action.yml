name: "Setup NodeJS"
description: "Setup NodeJS"
inputs:
  node_version:
    description: "NodeJS Version"
    required: true
  force_install:
    description: "Force install Cypress binary (emergency only)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
    # Omit version so pnpm/action-setup reads package.json packageManager
    # (keeps CI in sync with Dependabot bumps; do not reintroduce vars.PNPM_VERSION).
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Install dependencies
      shell: bash
      run: pnpm --frozen-lockfile recursive install
    - name: Force install Cypress
      if: inputs.force_install == 'true'
      shell: bash
      run: pnpx cypress install --force
