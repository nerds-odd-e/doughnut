name: donut deploy

on:
  workflow_run:
    workflows: ["donut CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  ARTIFACT: "donut"
  VERSION: "0.0.1-SNAPSHOT"
  FRONTEND_DIST_ARTIFACT: frontend-dist
  CLI_DIST_ARTIFACT: cli-dist
  GCS_BUCKET: "dough-01"
  # Public SPA + CLI only; LB backend bucket must point here (see docs/gcp/prod-frontend-static-lb.md).
  GCS_FRONTEND_BUCKET: "dough-frontend-01"
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

permissions:
  actions: read
  contents: read

jobs:
  release-admission:
    name: Admit selected application release
    runs-on: ${{ vars.RUNNER }}
    timeout-minutes: 70
    # Application publication is paused until the version-tag release path is enabled.
    if: ${{ false }}
    outputs:
      control_sha: ${{ steps.control.outputs.sha }}
      deploy: ${{ steps.ci.outputs.state == 'ready' }}
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
      ref: ${{ steps.identity.outputs.ref }}
      ref_oid: ${{ steps.identity.outputs.refOid }}
      run_id: ${{ steps.ci.outputs.runId }}
      run_attempt: ${{ steps.ci.outputs.runAttempt }}
      failure_stage: ${{ steps.identity.outcome != 'success' && 'identity' || 'CI admission' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Capture orchestration revision
        id: control
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Identify exact tagged main commit
        id: identity
        run: |
          node scripts/ci/application-release.mjs
      - name: Wait for successful CI of selected commit
        id: ci
        env:
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/application-release-ci.mjs

  Deploy:
    name: GCP deploy (GCS + MIG + health probe)
    timeout-minutes: 60
    runs-on: ${{ vars.RUNNER }}
    outputs:
      failure_stage: ${{ steps.publish.outcome == 'failure' && 'publication' || (steps.backend_artifact.outcome == 'failure' || steps.frontend_artifact.outcome == 'failure' || steps.cli_artifact.outcome == 'failure' || steps.payload.outcome == 'failure') && 'artifact admission' || 'deployment setup' }}
    needs: release-admission
    if: needs.release-admission.outputs.deploy == 'true'
    env:
      RELEASE_SHA: ${{ needs.release-admission.outputs.sha }}
      RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
      RELEASE_REF: ${{ needs.release-admission.outputs.ref }}
      RELEASE_REF_OID: ${{ needs.release-admission.outputs.ref_oid }}
      DEPLOY_JAR_PATH: release-artifacts/backend/donut-0.0.1-SNAPSHOT.jar
      FRONTEND_STATIC_DIR: release-artifacts/frontend
      CLI_BUNDLE_SOURCE: release-artifacts/cli/donut-cli.bundle.mjs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-admission.outputs.control_sha }}
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-admission.outputs.sha }}
          path: release-source
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install yaml for URL map scripts (avoid full monorepo pnpm)
        run: |
          mkdir -p "$RELEASE_SOURCE_ROOT/node_modules"
          npm install --prefix "$(pwd)/.ci-urlmap-node-deps" yaml@2.8.3
          ln -sfn "$(pwd)/.ci-urlmap-node-deps/node_modules/yaml" "$RELEASE_SOURCE_ROOT/node_modules/yaml"
      - name: Download CI artifacts
        id: backend_artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.release-admission.outputs.run_id }}
          name: ${{ env.ARTIFACT }}-${{ env.VERSION }}.jar
          path: release-artifacts/backend
      - name: Download frontend dist artifact
        id: frontend_artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.release-admission.outputs.run_id }}
          name: ${{ env.FRONTEND_DIST_ARTIFACT }}
          path: release-artifacts/frontend
      - name: Download CLI bundle artifact
        id: cli_artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.release-admission.outputs.run_id }}
          name: ${{ env.CLI_DIST_ARTIFACT }}
          path: release-artifacts/cli
      - name: Validate complete application payload
        id: payload
        run: node scripts/ci/application-release-payload.mjs
      - uses: ./.github/gcloud_auth_n_sdk
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS }}
          skip_install: ${{ runner.os == 'Linux' && vars.GCP_FORCE_GCLOUD_INSTALL != 'true' }}
      - name: Publish application to GCS and MIG
        id: publish
        run: GITHUB_SHA="$RELEASE_SHA" bash infra/gcp/scripts/publish-application.sh

  Notify-on-failure:
    name: Slack notification on release failure
    runs-on: ${{ vars.RUNNER }}
    needs: [release-admission, Deploy]
    if: always() && (needs.release-admission.result == 'failure' || needs.Deploy.result == 'failure')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-admission.outputs.control_sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Render selected release failure
        id: ctx
        env:
          RELEASE_TAG: ${{ needs.release-admission.outputs.tag }}
          RELEASE_SHA: ${{ needs.release-admission.outputs.sha }}
          RELEASE_CI_RUN_ID: ${{ needs.release-admission.outputs.run_id }}
          RELEASE_CI_RUN_ATTEMPT: ${{ needs.release-admission.outputs.run_attempt }}
          FAILURE_STAGE: ${{ needs.release-admission.result == 'failure' && needs.release-admission.outputs.failure_stage || needs.Deploy.outputs.failure_stage }}
        run: node scripts/ci/application-release-notification.mjs
      - uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: ${{ steps.ctx.outputs.payload }}
