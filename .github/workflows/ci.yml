name: Disposable browser-only cache comparison
on:
  push:
    branches:
      - codex/ci-cache-probe
permissions:
  contents: read
jobs:
  warm:
    name: Browser-only cache warm ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v6
      - name: Start preparation clock
        run: echo "PROBE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Candidate setup
        uses: ./.github/setup_nodejs_with_cache
        with:
          node_version: "26"
      - name: Inventory and verify
        shell: bash
        run: >
          set -euo pipefail

          echo "PROBE setup_ms=$(( $(date +%s%3N) - PROBE_START_MS )) sample=${{
          matrix.sample || 'single' }} mode=${{ github.job }}"

          echo "PROBE revision=$GITHUB_SHA runner_os=$RUNNER_OS
          runner_arch=$RUNNER_ARCH image=$ImageOS image_version=$ImageVersion"

          echo "PROBE node=$(node --version) pnpm=$(pnpm --version)
          lock_sha256=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"

          store_path=$(pnpm store path --silent)

          cypress_path=$(pnpm exec cypress cache path)

          echo "PROBE store_path=$store_path cypress_path=$cypress_path"

          du -sk "$store_path" "$cypress_path"

          du -k --max-depth=1 "$store_path" "$cypress_path" | sort -n

          pnpm exec cypress cache list

          pnpm exec cypress version

          expected=$(node -p 'require("cypress/package.json").version')

          actual=$(pnpm exec cypress version --component binary)

          test "$expected" = "$actual"

          mapfile -t cached_versions < <(find "$cypress_path" -mindepth 1
          -maxdepth 1 -type d -printf '%f\n' | sort)

          test "${#cached_versions[@]}" -eq 1

          test "${cached_versions[0]}" = "$expected"

          echo "PROBE package_binary_match=$expected
          sole_cached_version=${cached_versions[0]}"

          /usr/bin/time -f 'PROBE cypress_verify_seconds=%e' pnpm exec cypress
          verify
  clean:
    name: Clean uncached installation ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Start preparation clock
        run: echo "PROBE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v6
      - name: Install dependencies without cache
        run: /usr/bin/time -f 'PROBE install_seconds=%e' pnpm --frozen-lockfile
          recursive install
      - name: Inventory and verify
        shell: bash
        run: >
          set -euo pipefail

          echo "PROBE setup_ms=$(( $(date +%s%3N) - PROBE_START_MS )) sample=${{
          matrix.sample || 'single' }} mode=${{ github.job }}"

          echo "PROBE revision=$GITHUB_SHA runner_os=$RUNNER_OS
          runner_arch=$RUNNER_ARCH image=$ImageOS image_version=$ImageVersion"

          echo "PROBE node=$(node --version) pnpm=$(pnpm --version)
          lock_sha256=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"

          store_path=$(pnpm store path --silent)

          cypress_path=$(pnpm exec cypress cache path)

          echo "PROBE store_path=$store_path cypress_path=$cypress_path"

          du -sk "$store_path" "$cypress_path"

          du -k --max-depth=1 "$store_path" "$cypress_path" | sort -n

          pnpm exec cypress cache list

          pnpm exec cypress version

          expected=$(node -p 'require("cypress/package.json").version')

          actual=$(pnpm exec cypress version --component binary)

          test "$expected" = "$actual"

          mapfile -t cached_versions < <(find "$cypress_path" -mindepth 1
          -maxdepth 1 -type d -printf '%f\n' | sort)

          test "${#cached_versions[@]}" -eq 1

          test "${cached_versions[0]}" = "$expected"

          echo "PROBE package_binary_match=$expected
          sole_cached_version=${cached_versions[0]}"

          /usr/bin/time -f 'PROBE cypress_verify_seconds=%e' pnpm exec cypress
          verify
    strategy:
      fail-fast: false
      matrix:
        sample:
          - 1
          - 2
          - 3
  current-after-update:
    name: Browser-only current after prior cache with forced install
    needs:
      - warm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Start preparation clock
        run: echo "PROBE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Candidate setup with emergency input
        uses: ./.github/setup_nodejs_with_cache
        with:
          node_version: "26"
          force_install: "true"
      - name: Inventory and verify
        shell: bash
        run: >
          set -euo pipefail

          echo "PROBE setup_ms=$(( $(date +%s%3N) - PROBE_START_MS )) sample=${{
          matrix.sample || 'single' }} mode=${{ github.job }}"

          echo "PROBE revision=$GITHUB_SHA runner_os=$RUNNER_OS
          runner_arch=$RUNNER_ARCH image=$ImageOS image_version=$ImageVersion"

          echo "PROBE node=$(node --version) pnpm=$(pnpm --version)
          lock_sha256=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)"

          store_path=$(pnpm store path --silent)

          cypress_path=$(pnpm exec cypress cache path)

          echo "PROBE store_path=$store_path cypress_path=$cypress_path"

          du -sk "$store_path" "$cypress_path"

          du -k --max-depth=1 "$store_path" "$cypress_path" | sort -n

          pnpm exec cypress cache list

          pnpm exec cypress version

          expected=$(node -p 'require("cypress/package.json").version')

          actual=$(pnpm exec cypress version --component binary)

          test "$expected" = "$actual"

          mapfile -t cached_versions < <(find "$cypress_path" -mindepth 1
          -maxdepth 1 -type d -printf '%f\n' | sort)

          test "${#cached_versions[@]}" -eq 1

          test "${cached_versions[0]}" = "$expected"

          echo "PROBE package_binary_match=$expected
          sole_cached_version=${cached_versions[0]}"

          /usr/bin/time -f 'PROBE cypress_verify_seconds=%e' pnpm exec cypress
          verify
      - name: Verify release build consumer
        run: pnpm cli:bundle
