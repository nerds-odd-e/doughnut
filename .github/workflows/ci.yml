name: donut CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - ".planning/**"
      - "docs/**"

env:
  ARTIFACT: "donut"
  VERSION: "0.0.1-SNAPSHOT"
  FRONTEND_DIST_ARTIFACT: frontend-dist
  CLI_DIST_ARTIFACT: cli-dist
  MYSQL_UT_DB: "doughnut_test"
  MYSQL_E2E_DB: "doughnut_e2e_test"
  MYSQL_DB_USER: ${{ secrets.DBUSER }}
  MYSQL_DB_PASSWORD: ${{ secrets.DBPASSWORD }}
  REDIS_VERSION: "8.4"
  MYSQL_VERSION: "8.4"
  REDIS_PORT: "6380"
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_FOR_ISSUES_API_TOKEN: ${{ secrets.GH_ISSUES_API_TOKEN }}
  OPENAI_API_TOKEN: ${{ secrets.OPENAI_API_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  CI_PROOF_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  Lint-N-Backend-Generated-Types-For-Frontend:
    name: Linting & Types Gen for Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/lint_and_generated_types
        with:
          java_version: ${{ vars.JAVA_VERSION }}
          node_version: ${{ vars.NODE_VERSION }}

  Script-runner-probe:
    name: Script runner probe (${{ matrix.runner }})
    if: github.ref == 'refs/heads/codex/see-ci-results-and-timings-for-the-remaining-scr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy: { fail-fast: false, matrix: { runner: [1, 2, 3] } }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/script_runner_probe
        with:
          java_version: ${{ vars.JAVA_VERSION }}
          node_version: ${{ vars.NODE_VERSION }}
          probe_runner: ${{ matrix.runner }}

  Backend-unit-tests:
    name: Backend Unit tests
    runs-on: ${{ vars.RUNNER }}
    strategy: { fail-fast: false, matrix: { part: [1] } } # job-index for fragments
    steps:
      - uses: actions/checkout@v7
      - name: Setup MySQL DB Server
        uses: ./.github/mysql_db
        with:
          mysql_version: ${{ env.MYSQL_VERSION }}
          mysql_db_host_port: ${{ vars.MYSQL_PORT }}
          mysql_db_container_port: ${{ vars.MYSQL_PORT }}
          mysql_db_instance: ${{ env.MYSQL_UT_DB }}
          mysql_db_user: ${{ env.MYSQL_DB_USER }}
          mysql_db_password: ${{ env.MYSQL_DB_PASSWORD }}
      - name: Setup Redis DB Server
        uses: ./.github/redis_db
        with:
          redis_version: ${{ vars.REDIS_VERSION || env.REDIS_VERSION }}
          redis_port: ${{ vars.REDIS_PORT || env.REDIS_PORT }}
      - uses: ./.github/setup_jdk_with_cache
        with:
          java_version: ${{ vars.JAVA_VERSION }}
      - run: backend/gradlew -p backend migrateTestDB -Dspring.profiles.active=test
      - id: backend-tests
        run: backend/gradlew -p backend test -Dspring.profiles.active=test --parallel
      - if: ${{ !cancelled() && steps.backend-tests.outcome != 'skipped' }}
        uses: ./.github/ci_proof_fragments
        with:
          format: junit
          report: ${{ github.workspace }}/backend/build/test-results/test
          entry: backend/src/test/java
      # Jar repro is Gradle-only (SPA/CLI uploaded separately at deploy).
      - name: Boot jar reproducibility
        run: bash backend/scripts/boot-jar-reproducible.sh

  Frontend-unit-tests:
    # 2 shards: Vitest browser-mode leaks frame state; keep each session under
    # ~100 specs (raise when a shard nears ~125 files / ~250 total).
    name: Frontend Unit Tests (${{ matrix.shard }}/2)
    runs-on: ${{ vars.RUNNER }}
    strategy: { fail-fast: false, matrix: { shard: [1, 2] } }
    env:
      FRONTEND_UT_CONSOLE_OUTPUT_AS_FAILURE: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup_nodejs_with_cache
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - id: frontend-tests
        run: pnpm frontend:test --shard=${{ matrix.shard }}/2
        env:
          CI_PROOF_VITEST_REPORT: ${{ runner.temp }}/vitest-report.json
      - if: ${{ !cancelled() && steps.frontend-tests.outcome != 'skipped' }}
        uses: ./.github/ci_proof_fragments
        with:
          format: vitest
          report: ${{ runner.temp }}/vitest-report.json
          entry: frontend/tests

  ci-proof:
    name: CI proof summary
    needs:
      - E2E-tests
      - Frontend-unit-tests
      - Backend-unit-tests
      - Other-unit-tests
      - Lint-N-Backend-Generated-Types-For-Frontend
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/ci_proof_summary
        with:
          node_version: ${{ vars.NODE_VERSION }}
          expect: e2e_test/features=6 frontend/tests=2 backend/src/test/java=1 scripts=11

  Other-unit-tests:
    name: Other Unit Tests
    runs-on: ${{ vars.RUNNER }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/setup_nodejs_with_cache
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - run: pnpm cli:test
      - name: Run script unit tests
        id: script-tests
        run: bash scripts/test/run_all_script_tests.sh
        env:
          CI_PROOF_BASH_REPORT: ${{ runner.temp }}/bash-report.tsv
      - if: ${{ !cancelled() && steps.script-tests.outcome != 'skipped' }}
        uses: ./.github/ci_proof_fragments
        with:
          format: bash
          report: ${{ runner.temp }}/bash-report.tsv
          entry: scripts
          part: 1
          of: 11

  Package-artifacts:
    name: Package backend & frontend artifacts for deployment
    runs-on: ${{ vars.RUNNER }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/package_application_artifacts
        with:
          java_version: ${{ vars.JAVA_VERSION }}
          node_version: ${{ vars.NODE_VERSION }}

  E2E-tests:
    # Explicit feature dirs (not letter globs) keep Cypress load ~even across
    # the 6 shards. When adding a feature directory, put it in the lightest shard.
    name: End-to-End tests with Database
    runs-on: ${{ vars.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        spec:
          - |
            e2e_test/features/assimilation/**
            e2e_test/features/ai_generated_content/**
            e2e_test/features/ai_generated_recall_questions/**
            e2e_test/features/note_view/**
          - |
            e2e_test/features/bazaar/**
            e2e_test/features/book_reading/**
            e2e_test/features/folder_organization/**
            e2e_test/features/notebooks/**
          - |
            e2e_test/features/note_creation_and_update/**
          - |
            e2e_test/features/note_topology/**
            e2e_test/features/relationships/**
            e2e_test/features/circles/**
          - |
            e2e_test/features/recall/**
            e2e_test/features/wikidata/**
            e2e_test/features/mcp/**
          - |
            e2e_test/features/cli/**
            e2e_test/features/messages/**
            e2e_test/features/testability/**
            e2e_test/features/user_admin/**
            e2e_test/features/users/**
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: ./.github/mysql_db
        with:
          mysql_version: ${{ env.MYSQL_VERSION }}
          mysql_db_host_port: ${{ vars.MYSQL_PORT }}
          mysql_db_container_port: ${{ vars.MYSQL_PORT }}
          mysql_db_instance: ${{ env.MYSQL_E2E_DB }}
          mysql_db_user: ${{ env.MYSQL_DB_USER }}
          mysql_db_password: ${{ env.MYSQL_DB_PASSWORD }}
      - name: Setup Redis DB Server
        uses: ./.github/redis_db
        with:
          redis_version: ${{ vars.REDIS_VERSION || env.REDIS_VERSION }}
          redis_port: ${{ vars.REDIS_PORT || env.REDIS_PORT }}
      - name: Setup JDK
        uses: ./.github/setup_jdk_with_cache
        with:
          java_version: ${{ vars.JAVA_VERSION }}
      - name: Setup E2E Cypress dependencies
        uses: ./.github/setup_nodejs_with_cache
        with:
          node_version: ${{ vars.NODE_VERSION }}
      - uses: ./.github/e2e_bundles
      - name: Run E2E matrix via owned invocation wrapper
        id: e2e-tests
        run: |
          SUT_RUNTIME_TARGET='{"built":true}' node scripts/e2e-runner.mjs --spec "${{ matrix.spec }}" --browser chrome
        env:
          GITHUB_FOR_ISSUES_API_TOKEN: ${{ env.GITHUB_FOR_ISSUES_API_TOKEN }}
          NO_PROXY: 127.0.0.1,localhost
          CI_PROOF_CUCUMBER_MESSAGES: ${{ runner.temp }}/cucumber-messages.ndjson
      - if: ${{ !cancelled() && steps.e2e-tests.outcome != 'skipped' }}
        uses: ./.github/ci_proof_fragments
        with:
          format: cucumber
          report: ${{ runner.temp }}/cucumber-messages.ndjson
          entry: e2e_test/features
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e_test/screenshots
