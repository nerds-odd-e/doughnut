name: "Probe the full script group"
description: "Repeat the full script group and keep every runner observation"
inputs:
  java_version:
    description: "JDK version"
    required: true
  node_version:
    description: "Node.js version"
    required: true
  probe_runner:
    description: "Runner identity within the probe series"
    required: true
runs:
  using: "composite"
  steps:
    - id: lint-environment
      uses: ./.github/lint_environment
      with:
        java_version: ${{ inputs.java_version }}
        node_version: ${{ inputs.node_version }}
    - shell: bash
      run: pnpm lint:all
    - name: Repeat the full script group ten times
      env:
        PROBE_RUNNER: ${{ inputs.probe_runner }}
        PROBE_MYSQL_INSTALL_SECONDS: ${{ steps.lint-environment.outputs.mysql-install-seconds }}
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { spawnSync } from 'node:child_process'
        import { mkdirSync, writeFileSync } from 'node:fs'
        import { cpus, freemem, hostname, loadavg, totalmem } from 'node:os'
        import { join } from 'node:path'

        const files = [
          'scripts/dev-healthcheck.test.mjs',
          'scripts/isolated-cypress-openai-mock-cancel.test.mjs',
          'scripts/isolated-cypress-openai-mock-failure.test.mjs',
          'scripts/isolated-cypress-openai-mock-ownership.test.mjs',
          'scripts/isolated-cypress-openai-mock.test.mjs',
          'scripts/isolated-cypress-owning-health.test.mjs',
          'scripts/isolated-openai-mock.test.mjs',
          'scripts/isolated-service-mocks.test.mjs',
          'scripts/local-runtime-target.test.mjs',
          'scripts/profiling/verify-publication-receiver.test.mjs',
          'scripts/sut-owner-application-group.test.mjs',
          'scripts/worktree-reset-isolation-harness-openai-mock.test.mjs',
          'scripts/worktree-reset-isolation-harness-wikidata-mock.test.mjs',
          'scripts/worktree-retirement-checkout-processes.test.mjs',
          'scripts/worktree-retirement-e2e-mutation.test.mjs',
          'scripts/worktree-retirement-evidence.test.mjs',
          'scripts/worktree-retirement-mutation.test.mjs',
          'scripts/worktree-retirement.test.mjs',
        ]
        const directory = join(process.env.RUNNER_TEMP, 'script-runner-probe')
        mkdirSync(directory, { recursive: true })
        const command = (program, args) => {
          const result = spawnSync(program, args, { encoding: 'utf8' })
          if (result.status !== 0) throw new Error(`${program}: ${result.stderr || result.error}`)
          return result.stdout.trim()
        }
        const metadata = {
          revision: process.env.GITHUB_SHA,
          run: process.env.GITHUB_RUN_ID,
          attempt: process.env.GITHUB_RUN_ATTEMPT,
          runner: process.env.PROBE_RUNNER,
          runnerName: process.env.RUNNER_NAME,
          runnerImage: process.env.ImageOS,
          runnerImageVersion: process.env.ImageVersion,
          hostname: hostname(),
          cpus: cpus().length,
          memoryBytes: { total: totalmem(), free: freemem() },
          load: loadavg(),
          mysqlInstallSeconds: Number(process.env.PROBE_MYSQL_INSTALL_SECONDS),
          mysqld: join(process.env.MYSQL_BASEDIR, 'bin/mysqld'),
          mysqlVersion: command(join(process.env.MYSQL_BASEDIR, 'bin/mysqld'), ['--version']),
          paths: Object.fromEntries(['lsof', 'ps', 'javac'].map(name => [name, command('which', [name])])),
          files,
        }
        writeFileSync(join(directory, 'metadata.json'), JSON.stringify(metadata, null, 2))
        const results = []
        for (let repetition = 1; repetition <= 10; repetition++) {
          const started = performance.now()
          const result = spawnSync(process.execPath, ['--test', '--test-reporter=tap', ...files], {
            encoding: 'utf8', maxBuffer: 20 * 1024 * 1024, timeout: 120_000,
          })
          const output = `${result.stdout ?? ''}${result.stderr ?? ''}`
          writeFileSync(join(directory, `repetition-${repetition}.tap`), output)
          const counts = Object.fromEntries([...output.matchAll(/^# (tests|suites|pass|fail|cancelled|skipped|todo|duration_ms) ([\d.]+)$/gm)].map(([, key, value]) => [key, Number(value)]))
          const entry = {
            repetition, status: result.status, signal: result.signal,
            error: result.error?.message, elapsedMs: performance.now() - started, counts,
          }
          results.push(entry)
          writeFileSync(join(directory, 'results.json'), JSON.stringify(results, null, 2))
          console.log(JSON.stringify(entry))
          if (result.status !== 0) console.log(output)
        }
        if (results.some(result => result.status !== 0 || result.counts.fail !== 0 || result.counts.cancelled !== 0 || result.counts.skipped !== 0 || result.counts.todo !== 0)) process.exitCode = 1
        NODE
    - if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: script-runner-probe-attempt-${{ github.run_attempt }}-runner-${{ inputs.probe_runner }}
        path: ${{ runner.temp }}/script-runner-probe
        if-no-files-found: error
