name: "Keep CI proof fragments"
description: "Convert a test runner's report into CI proof fragments, as one part of its entry, and keep them for the ci-proof job"
inputs:
  format:
    description: "Report format that scripts/ci/ci-proof-outcomes.mjs converts"
    required: true
  report:
    description: "Absolute path of the runner's report file, or a directory of TEST-*.xml for junit"
    required: true
  entry:
    description: "Intent location the report proves"
    required: true
  part:
    description: "This report's part of the entry, from 1; defaults to the matrix job's strategy.job-index plus 1"
    required: false
  of:
    description: "The entry's number of parts; defaults to the matrix's strategy.job-total"
    required: false
runs:
  using: "composite"
  steps:
    - name: Write the CI proof fragments
      id: fragments
      shell: bash
      env:
        FORMAT: ${{ inputs.format }}
        REPORT: ${{ inputs.report }}
        ENTRY: ${{ inputs.entry }}
        PART: ${{ inputs.part }}
        PARTS: ${{ inputs.of }}
        JOB_INDEX: ${{ strategy.job-index }}
        JOB_TOTAL: ${{ strategy.job-total }}
      run: |
        PART="${PART:-$((JOB_INDEX + 1))}"
        PARTS="${PARTS:-${JOB_TOTAL}}"
        echo "part=${PART}" >> "${GITHUB_OUTPUT}"
        # Fresh staging, so a job's later part never uploads an earlier one.
        rm -rf "${RUNNER_TEMP}/ci-proof"
        node scripts/ci/ci-proof-outcomes.mjs "${FORMAT}" "${REPORT}" \
          "${RUNNER_TEMP}/ci-proof-times.tsv" > "${RUNNER_TEMP}/ci-proof-outcomes.tsv"
        node scripts/ci/ci-proof-summary.mjs fragment \
          --outcomes "${RUNNER_TEMP}/ci-proof-outcomes.tsv" \
          --times "${RUNNER_TEMP}/ci-proof-times.tsv" --by-file --entry "${ENTRY}" \
          --part "${PART}" --of "${PARTS}" --attempt "${GITHUB_RUN_ATTEMPT}" \
          --revision "${CI_PROOF_REVISION}" --out "${RUNNER_TEMP}/ci-proof"
    - name: Keep the CI proof fragments
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ci-proof-fragments-${{ github.job }}-${{ steps.fragments.outputs.part }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-proof/
        if-no-files-found: ignore
        retention-days: 1
