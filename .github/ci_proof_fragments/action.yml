name: "Keep CI proof fragments"
description: "Convert a test runner's report into this matrix job's CI proof fragments, as one part of its entry, and keep them for the ci-proof job"
inputs:
  format:
    description: "Report format that scripts/ci/ci-proof-outcomes.mjs converts"
    required: true
  report:
    description: "Absolute path of the runner's report"
    required: true
  entry:
    description: "Intent location the report proves"
    required: true
runs:
  using: "composite"
  steps:
    - name: Write the CI proof fragments
      id: fragments
      shell: bash
      env:
        FORMAT: ${{ inputs.format }}
        REPORT: ${{ inputs.report }}
        ENTRY: ${{ inputs.entry }}
        JOB_INDEX: ${{ strategy.job-index }}
        PARTS: ${{ strategy.job-total }}
      run: |
        PART=$((JOB_INDEX + 1))
        echo "part=${PART}" >> "${GITHUB_OUTPUT}"
        node scripts/ci/ci-proof-outcomes.mjs "${FORMAT}" "${REPORT}" \
          "${RUNNER_TEMP}/ci-proof-times.tsv" > "${RUNNER_TEMP}/ci-proof-outcomes.tsv"
        node scripts/ci/ci-proof-summary.mjs fragment \
          --outcomes "${RUNNER_TEMP}/ci-proof-outcomes.tsv" \
          --times "${RUNNER_TEMP}/ci-proof-times.tsv" --by-file --entry "${ENTRY}" \
          --part "${PART}" --of "${PARTS}" --attempt "${GITHUB_RUN_ATTEMPT}" \
          --revision "${CI_PROOF_REVISION}" --out "${RUNNER_TEMP}/ci-proof"
    - name: Keep the CI proof fragments
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ci-proof-fragments-${{ github.job }}-${{ steps.fragments.outputs.part }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-proof/
        if-no-files-found: ignore
        retention-days: 1
