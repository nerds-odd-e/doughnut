name: "Setup NodeJS with pnpm cache"
description: "Setup NodeJS with pnpm cache"
inputs:
  node_version:
    description: "NodeJS Version"
    required: true
  force_install:
    description: "Force install Cypress binary (emergency only)"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Setup NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
    # Omit version so pnpm/action-setup reads package.json packageManager
    # (keeps CI in sync with Dependabot bumps; do not reintroduce vars.PNPM_VERSION).
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Resolve dependency cache metadata
      id: cache-metadata
      shell: bash
      run: |
        echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "node-version=$(node --version)" >> "$GITHUB_OUTPUT"
        echo "pnpm-version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
        echo "cypress-version=$(node -p 'require("./package.json").devDependencies.cypress')" >> "$GITHUB_OUTPUT"
    - name: Restore pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ steps.cache-metadata.outputs.store-path }}
        key: pnpm-store-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-metadata.outputs.node-version }}-${{ steps.cache-metadata.outputs.pnpm-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
    - name: Restore Cypress binary
      uses: actions/cache@v6
      with:
        path: ~/.cache/Cypress/${{ steps.cache-metadata.outputs.cypress-version }}
        key: cypress-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-metadata.outputs.cypress-version }}
    - name: Install dependencies
      shell: bash
      run: pnpm --frozen-lockfile recursive install
    - name: Force install Cypress
      if: inputs.force_install == 'true'
      shell: bash
      run: pnpx cypress install --force
