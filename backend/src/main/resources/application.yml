---
spring:
  profiles:
    active: "test"
  config:
    import: db-test.properties
  logging:
    level:
      root: OFF
      org.springframework: OFF
      org.springframework.web: ERROR
      com.odde.doughnut: ERROR
      org.hibernate: ERROR
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
          no-cache: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: ${db.url}
    username: ${db.user}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    placeholders:
      embedding_column: "embedding_raw VARBINARY(6144) NOT NULL"
      recall_anchor_repair: "1=0"
      tz_repair: "1=0"
      dummy_note_sequence_skip_convert: "1=0"
      dummy_property_sequence_skip_convert: "1=0"
      still_new_again_first_rating_backfill: "1=0"
      still_new_hard_first_rating_backfill: "1=0"
  jpa:
    generate-ddl: false
    show-sql: false
    properties.hibernate:
      enable_lazy_load_no_trans: true
      globally_quoted_identifiers: true
      globally_quoted_identifiers_skip_column_definitions: true
    open-in-view: false
  redis:
    host: 127.0.0.1
    port: 6380
    timeout: 2000ms
    connect-timeout: 2000ms
  github_for_issues:
    repo: nerds-odd-e/doughnut_sandbox
    token: ${GITHUB_FOR_ISSUES_API_TOKEN:-token_not_set}
  openai:
    token: ${OPENAI_API_TOKEN:}
# Book PDF storage: any non-`prod` profile → DbBookStorage (AttachmentBlob). Profile `prod` → GcsBookStorage only
# (`doughnut.book-pdf.gcs.bucket` required; optional `object-prefix`). Max PDF part size: `spring.servlet.multipart.max-file-size` (100MB). Ops: docs/gcp/prod_env.md §7.
question:
  regeneration:
    times: 0
server:
  forward-headers-strategy: FRAMEWORK
  port: 8081
springdoc:
  override-with-generic-response: false
  writer-with-json-view: true
  api-docs:
    enabled: true
    path: /api-docs
---
spring:
  config:
    import: db-e2e.properties
    activate:
      on-profile: e2e
  logging:
    level:
      root: INFO
      org.springframework: INFO
      org.springframework.web: INFO
      com.odde.doughnut: INFO
      org.hibernate: WARN
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: ${INPUT_DB_URL:jdbc:mysql://127.0.0.1:3309/doughnut_e2e_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${db.user}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
  flyway:
    clean-disabled: true
    placeholders:
      embedding_column: "embedding_raw VARBINARY(6144) NOT NULL"
      recall_anchor_repair: "1=0"
      tz_repair: "1=0"
      dummy_note_sequence_skip_convert: "1=0"
      dummy_property_sequence_skip_convert: "1=0"
      still_new_again_first_rating_backfill: "1=0"
      still_new_hard_first_rating_backfill: "1=0"
  jpa:
    generate-ddl: false
    show-sql: false
    properties.hibernate:
      enable_lazy_load_no_trans: true
      globally_quoted_identifiers: true
      globally_quoted_identifiers_skip_column_definitions: true
    open-in-view: false
  redis:
    host: 127.0.0.1
    port: 6380
    timeout: 2000ms
    connect-timeout: 2000ms
  github_for_issues:
    repo: nerds-odd-e/doughnut_sandbox
    token: ${GITHUB_FOR_ISSUES_API_TOKEN:-token_not_set}
  openai:
    token: ${OPENAI_API_TOKEN:}
question:
  regeneration:
    times: 1
server:
  forward-headers-strategy: FRAMEWORK
  port: 9081
springdoc:
  override-with-generic-response: false
  writer-with-json-view: true
  api-docs:
    enabled: true
    path: /api-docs
---
