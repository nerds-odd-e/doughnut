donut.canonical-origin=https://donut.test
logging.level.org.springframework=OFF
logging.level.root=OFF
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.test.web.servlet.result=ERROR
spring.github_for_issues.token=xxx
spring.openai.token=test_token_for_openai
spring.datasource.hikari.minimum-idle=1
question.regeneration.times=1
donut.oauth.clients[0].client-id=test-assistant
donut.oauth.clients[0].client-name=Test assistant
donut.oauth.clients[0].client-secret={noop}test-assistant-secret
donut.oauth.clients[0].redirect-uris[0]=https://assistant.example/callback
donut.oauth.clients[1].client-id=another-test-assistant
donut.oauth.clients[1].client-name=Another test assistant
donut.oauth.clients[1].client-secret={noop}another-test-secret
donut.oauth.clients[1].redirect-uris[0]=https://another-assistant.example/callback
